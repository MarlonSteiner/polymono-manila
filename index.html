<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Polymono Manila</title>
  <meta name="description" content="Buy the bay, build the skyline. A cozy property-trading board game set in Metro Manila for 2 to 6 players.">
  <meta name="theme-color" content="#ffd9b8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Polymono">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home" class="screen"><div id="home-stage" class="stage"></div><div id="home-ui"></div></section>
  <section id="setup" class="screen"><div id="setup-ui"></div></section>
  <section id="game" class="screen"></section>
  <div id="layer"><div id="toasts"></div></div>
  <script>
    // Right after an update the host can briefly serve a mix of old and new files, and the game won't start.
    // If it hasn't started after a few seconds, or a file fails to load, reload once to get a matching set.
    (function () {
      var retry = function () {
        try { if (sessionStorage.getItem('pm-retry')) return; sessionStorage.setItem('pm-retry', '1'); } catch (e) { return; }
        location.reload();
      };
      window.addEventListener('error', function (e) { if (/module|export|import/i.test(String(e.message || ''))) retry(); });
      setTimeout(function () { if (!document.body.classList.contains('ready')) retry(); }, 6000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
